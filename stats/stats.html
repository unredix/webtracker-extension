<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly overview</title>
    <link rel="stylesheet" href="stats.css" />
  </head>
  <body>
    <div class="page">
      <div class="title">
        <h1 id="page-title">Weekly Overview</h1>
        <p class="subtitle" id="page-subtitle">Last 7 days of browsing activity</p>
      </div>

      <div class="range-row" id="range-row">
        <button type="button" class="range-btn" data-days="7">7 days</button>
        <button type="button" class="range-btn" data-days="30">30 days</button>
      </div>

      <div class="stat-row" id="stat-row"></div>

      <section class="card">
        <h2>Time per day</h2>
        <div class="chart-wrap" id="daily-chart"></div>
      </section>

      <section class="card">
        <h2>Top sites</h2>
        <div class="chart-wrap" id="sites-chart"></div>
      </section>

      <section class="card">
        <h2>Time by category</h2>
        <div class="chart-wrap" id="categories-chart"></div>
      </section>
    </div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <script src="stats.js" type="module"></script>
  </body>
</html>
