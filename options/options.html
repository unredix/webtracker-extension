<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="title">
      <h1>Options</h1>
    </div>
    <section>
      <h2>Ignore</h2>
      <div class="ignore">
        <div class="ignore-input">
          <p>Add sites to ignore</p>
          <input type="text" name="ignore-url" id="ignore-url" placeholder="example.com" />
          <p class="field-error" id="ignore-url-error"></p>
          <input
            type="checkbox"
            name="ignore-incog"
            id="ignore-incog"
            class="checkbox-option"
          />
          <label for="ignore-incog">Ignore incognito</label>
        </div>
        <div class="ignore-list">
          <ul id="ignored-sites-list"></ul>
        </div>
      </div>
    </section>
    <section>
      <h2>Per-site daily limits</h2>
      <div class="ignore">
        <div class="ignore-input">
          <p>Add a site limit</p>
          <input type="text" name="limit-url" id="limit-url" placeholder="example.com" />
          <input type="number" name="limit-minutes" id="limit-minutes" placeholder="Minutes" min="1" max="1440" />
          <button type="button" id="add-limit">Add</button>
          <p class="field-error" id="limit-error"></p>
        </div>
        <div class="ignore-list">
          <ul id="site-limits-list"></ul>
        </div>
      </div>
    </section>
    <section>
      <h2>Global daily limit</h2>
      <div class="ignore-input">
        <input
          type="checkbox"
          name="global-limit-enabled"
          id="global-limit-enabled"
          class="checkbox-option"
        />
        <label for="global-limit-enabled">Enable an overall daily browsing limit</label>
        <div>
          <input
            type="number"
            name="global-limit-minutes"
            id="global-limit-minutes"
            placeholder="Minutes"
            min="1"
            max="1440"
          />
        </div>
        <p class="field-error" id="global-limit-error"></p>
      </div>
    </section>
    <!-- Language selection is deferred: chrome.i18n follows the browser's UI
         locale, not a user-chosen value, so a manual picker would need a
         custom message-loading layer plus translated challenge content.
         That's out of scope for this pass. -->
    <footer>
      <button style="display: none" id="save-changes">Save</button>
      <button style="display: none" id="cancel-changes">Cancel</button>
    </footer>
    <script src="options.js" type="module"></script>
  </body>
</html>
